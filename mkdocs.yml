site_name: Mortuary T Documentation Portfolio
site_description: A sanitized docs-as-code and business-analysis portfolio
site_url: https://ryansplan.github.io/mortuary-t-docs/
repo_url: https://github.com/ryansplan/mortuary-t-docs
repo_name: ryansplan/mortuary-t-docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    primary: blue grey
    accent: teal

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Portfolio overview: portfolio-overview.md
  - Product documentation:
      - Getting started:
          - First Call: getting-started/index.md
          - Property inventory: getting-started/property-inventory.md
          - Witness signature: getting-started/witness-signature.md
          - Compliance exports: getting-started/compliance-exports.md
  - Developer documentation:
      - Overview: developer-guide/index.md
  - Business analysis:
      - Artifact index: business-analysis/index.md
      - First Call requirements: business-analysis/first-call-requirements.md
      - Requirements traceability: business-analysis/first-call-traceability.md
      - UAT plan and results: business-analysis/first-call-uat.md
  - Documentation quality:
      - Quality workflow: quality/index.md
      - Style guide: style-guide.md
  - Contributing: contributing.md
  - Security and privacy: security.md

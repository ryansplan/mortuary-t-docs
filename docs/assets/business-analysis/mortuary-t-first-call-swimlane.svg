<svg xmlns="http://www.w3.org/2000/svg" width="1632" height="1056" viewBox="0 0 1632 1056" role="img" aria-labelledby="title desc">
<title id="title">Mortuary T First Call cross-functional workflow</title>
<desc id="desc">A four-lane swimlane showing how the Case Owner, Mortuary T, the Compliance Record, and the Device Sharing App create a case, capture and review First Call information, save it to Compliance before sharing, hand it to an external app, and verify the saved record.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,4 L0,8 z" fill="#8A98A6"/>
</marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17324D" flood-opacity="0.14"/>
</filter>
</defs>
<rect width="1632" height="1056" fill="#FFFFFF"/>
<text text-anchor="start" font-family="Aptos, Arial, sans-serif" font-size="27" font-weight="700" fill="#17324D"><tspan x="40" y="50.0">First Call: Create, Save to Compliance, and Share</tspan></text>
<text text-anchor="start" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#5C6873"><tspan x="40" y="82.0">Mortuary T cross-functional workflow | Sanitized portfolio artifact</tspan></text>
<rect x="40" y="105" width="1552" height="34" rx="8" fill="#EAF2F7"/>
<text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E5D7B"><tspan x="816" y="127.0">FLOW 1 Create case → 2 Capture and review → 3 Save to Compliance → 4 External handoff → 5 Verify</tspan></text>
<rect x="40" y="148" width="360" height="886" fill="#FFFFFF" stroke="#CBD4DC"/>
<rect x="40" y="148" width="360" height="48" fill="#17324D"/>
<text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="220.0" y="179.0">Case Owner</tspan></text>
<rect x="400" y="148" width="380" height="886" fill="#F7F9FB" stroke="#CBD4DC"/>
<rect x="400" y="148" width="380" height="48" fill="#147D7E"/>
<text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="590.0" y="179.0">Mortuary T</tspan></text>
<rect x="780" y="148" width="365" height="886" fill="#FFFFFF" stroke="#CBD4DC"/>
<rect x="780" y="148" width="365" height="48" fill="#2E5D7B"/>
<text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="962.5" y="179.0">Compliance Record</tspan></text>
<rect x="1145" y="148" width="447" height="886" fill="#F7F9FB" stroke="#CBD4DC"/>
<rect x="1145" y="148" width="447" height="48" fill="#6B5B95"/>
<text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="1368.5" y="179.0">Device Sharing App</tspan></text>
<rect x="120" y="216" width="200" height="48" rx="24" fill="#E8F4EE" stroke="#2E7D5A" stroke-width="2.4"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="220.0" y="245.0">No active case</tspan></text>
<rect x="98" y="292" width="244" height="58" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="220.0" y="326.0">Select Start New Case</tspan></text>
<rect x="450" y="284" width="280" height="74" rx="12" fill="#E7F4F1" stroke="#147D7E" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="590.0" y="317.0">Generate Case Ref; assign Case</tspan><tspan x="590.0" y="335.0">Owner; set First Call to Draft</tspan></text>
<rect x="98" y="386" width="244" height="58" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="220.0" y="420.0">Select Open First Call</tspan></text>
<rect x="82" y="476" width="276" height="86" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="220.0" y="506.0">Record the three-step First Call:</tspan><tspan x="220.0" y="524.0">deceased, location, transport, call,</tspan><tspan x="220.0" y="542.0">and notes</tspan></text>
<rect x="450" y="482" width="280" height="74" rx="12" fill="#E7F4F1" stroke="#147D7E" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="590.0" y="515.0">Keep draft and form state linked to</tspan><tspan x="590.0" y="533.0">the active Case Ref</tspan></text>
<rect x="98" y="602" width="244" height="58" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="220.0" y="636.0">Review First Call summary</tspan></text>
<polygon points="220,672.0 330.0,718 220,764.0 110.0,718" fill="#FFF4D6" stroke="#C98A16" stroke-width="2.4"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E2A35"><tspan x="220" y="723.0">Information correct?</tspan></text>
<rect x="78" y="798" width="170" height="58" rx="12" fill="#FAECEC" stroke="#A94B4B" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="163.0" y="832.0">Select Edit First Call</tspan></text>

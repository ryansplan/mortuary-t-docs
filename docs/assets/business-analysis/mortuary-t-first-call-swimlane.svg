<rect x="455" y="682" width="270" height="72" rx="12" fill="#E7F4F1" stroke="#147D7E" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="590.0" y="714.0">Select Save &amp; Share First Call</tspan><tspan x="590.0" y="732.0">Summary</tspan></text>
<polygon points="590,788.0 698.0,836 590,884.0 482.0,836" fill="#FFF4D6" stroke="#C98A16" stroke-width="2.4"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E2A35"><tspan x="590" y="832.5">Continue from</tspan><tspan x="590" y="849.5">confirmation?</tspan></text>
<rect x="418" y="900" width="156" height="52" rx="12" fill="#FAECEC" stroke="#A94B4B" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E2A35"><tspan x="496.0" y="923.0">Cancel: return to</tspan><tspan x="496.0" y="939.0">summary; no save</tspan></text>
<rect x="624" y="900" width="140" height="52" rx="12" fill="#E7F4F1" stroke="#147D7E" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E2A35"><tspan x="694.0" y="923.0">Save First Call</tspan><tspan x="694.0" y="939.0">before sharing</tspan></text>
<rect x="818" y="884" width="288" height="70" rx="12" fill="#EAF2F7" stroke="#2E5D7B" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="962.0" y="907.0">Store the case-linked First Call;</tspan><tspan x="962.0" y="924.0">status is available for Compliance</tspan><tspan x="962.0" y="941.0">review</tspan></text>
<rect x="1190" y="666" width="356" height="76" rx="12" fill="#F0ECF8" stroke="#6B5B95" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="1368.0" y="700.0">Open device sharing options; user selects</tspan><tspan x="1368.0" y="718.0">the actual recipient</tspan></text>
<polygon points="1368,778.0 1494.0,826 1368,874.0 1242.0,826" fill="#FFF4D6" stroke="#C98A16" stroke-width="2.4"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E2A35"><tspan x="1368" y="822.5">Send or cancel in</tspan><tspan x="1368" y="839.5">selected app?</tspan></text>
<rect x="1192" y="902" width="352" height="52" rx="12" fill="#F0ECF8" stroke="#6B5B95" stroke-width="2" stroke-dasharray="7 5"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="1368.0" y="933.0">Mortuary T does not confirm delivery</tspan></text>
<rect x="822" y="976" width="280" height="44" rx="12" fill="#EAF2F7" stroke="#2E5D7B" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="962.0" y="1003.0">First Call remains saved</tspan></text>
<rect x="420" y="964" width="340" height="60" rx="12" fill="#E7F4F1" stroke="#147D7E" stroke-width="2"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="590.0" y="990.5">On return: show Share Action Completed; set</tspan><tspan x="590.0" y="1007.5">First Call to Needs Review; case is Current</tspan></text>
<rect x="84" y="970" width="282" height="54" rx="27" fill="#E8F4EE" stroke="#2E7D5A" stroke-width="2.4"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A35"><tspan x="225.0" y="993.0">Verify via View in</tspan><tspan x="225.0" y="1011.0">Compliance</tspan></text>

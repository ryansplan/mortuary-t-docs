<rect x="798" y="210" width="328" height="118" rx="12" fill="#FFFDF7" stroke="#C98A16" stroke-width="2" stroke-dasharray="7 5"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E2A35"><tspan x="962.0" y="250.0">Business rule: Property Inventory and</tspan><tspan x="962.0" y="266.0">Witness Signature are independent</tspan><tspan x="962.0" y="282.0">activities; this workflow does not change</tspan><tspan x="962.0" y="298.0">their statuses.</tspan></text>
<rect x="1170" y="392" width="398" height="126" rx="12" fill="#F0ECF8" stroke="#6B5B95" stroke-width="2" stroke-dasharray="7 5"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="14" font-weight="500" fill="#1E2A35"><tspan x="1369.0" y="443.0">Boundary: a device-sharing handoff is not proof</tspan><tspan x="1369.0" y="460.0">of delivery. Verify delivery in the selected app</tspan><tspan x="1369.0" y="477.0">when needed.</tspan></text>
<rect x="804" y="406" width="316" height="98" rx="12" fill="#FFFDF7" stroke="#C98A16" stroke-width="2" stroke-dasharray="7 5"/><text text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="500" fill="#1E2A35"><tspan x="962.0" y="444.0">Control: locked First Calls are read-only.</tspan><tspan x="962.0" y="460.0">Only the Case Owner may reopen or perform</tspan><tspan x="962.0" y="476.0">owner-only final actions.</tspan></text>
